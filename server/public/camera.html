<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PhoneOBS Camera</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="camera-shell" id="camera-shell">
    <header class="camera-header">
      <span class="wordmark">PHONEOBS</span>
      <span class="slot-label" id="slot-label"></span>
    </header>
    <video id="preview" autoplay playsinline muted></video>
    <section class="camera-controls" id="camera-controls">
      <label for="resolution">Resolution</label>
      <select id="resolution" disabled></select>
      <p id="actual-resolution">Waiting for camera permission</p>
    </section>
    <p class="connection-state" id="connection-state" role="status">Starting camera…</p>
  </main>
  <script type="module" src="./camera.js"></script>
</body>
</html>
